{% extends 'base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0"><i class="bi bi-envelope-paper"></i> Восстановление пароля</h4>
            </div>
            <div class="card-body">
                <p class="text-muted text-center">
                    Введите email, указанный при регистрации. 
                    Мы отправим вам ссылку для создания нового пароля.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" 
                               class="form-control" 
                               id="id_email" 
                               placeholder="your@email.com"
                               required autofocus>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send"></i> Отправить ссылку
                        </button>
                    </div>
                </form>

                <hr>
                <div class="text-center small">
                    <a href="{% url 'login' %}">← Вернуться ко входу</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
